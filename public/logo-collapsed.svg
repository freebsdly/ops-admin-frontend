<svg width="56" height="56" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoCollapsedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1890ff" />
      <stop offset="100%" stop-color="#52c41a" />
    </linearGradient>
  </defs>
  
  <!-- Background fills entire area -->
  <rect width="56" height="56" fill="url(#logoCollapsedGradient)" rx="0"/>
  
  <!-- Gear icon centered - scaled to fill most of the area -->
  <circle cx="28" cy="28" r="20" fill="white" />
  <circle cx="28" cy="28" r="16" fill="url(#logoCollapsedGradient)" />
  <circle cx="28" cy="28" r="8" fill="white" />
  
  <!-- Gear teeth -->
  <rect x="40" y="26" width="4" height="4" fill="white" transform="rotate(45 28 28)" />
  <rect x="16" y="26" width="4" height="4" fill="white" transform="rotate(-45 28 28)" />
  <rect x="26" y="38" width="4" height="4" fill="white" transform="rotate(0 28 28)" />
  <rect x="26" y="18" width="4" height="4" fill="white" transform="rotate(0 28 28)" />
</svg>