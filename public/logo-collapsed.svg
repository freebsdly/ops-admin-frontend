<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main gradient matching expanded logo -->
    <linearGradient id="logoCollapsedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1890ff" />
      <stop offset="50%" stop-color="#096dd9" />
      <stop offset="100%" stop-color="#52c41a" />
    </linearGradient>

    <!-- Drop shadow for depth -->
    <filter id="collapsedDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="blur"/>
      <feOffset in="blur" dx="0" dy="2" result="offsetBlur"/>
      <feFlood flood-color="rgba(0,0,0,0.15)" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feComposite in="SourceGraphic" in2="shadow" operator="over"/>
    </filter>

    <!-- Subtle inner glow -->
    <filter id="collapsedInnerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur"/>
      <feOffset in="blur" dx="0" dy="0.5" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="48" height="48" fill="url(#logoCollapsedGradient)" rx="4"/>

  <!-- Subtle top highlight -->
  <rect x="0" y="0" width="48" height="24" fill="url(#collapsedTopHighlight)" opacity="0.15" rx="4"/>
  <linearGradient id="collapsedTopHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#ffffff" />
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
  </linearGradient>

  <!-- Centered gear icon -->
  <g transform="translate(24, 24)" filter="url(#collapsedDropShadow)">
    <!-- Outer gear ring -->
    <circle cx="0" cy="0" r="15.5" fill="none" stroke="white" stroke-width="2" opacity="0.9"/>

    <!-- Gear teeth (8 evenly spaced) -->
    <g fill="white" opacity="0.95">
      <rect x="-2.5" y="-15" width="5" height="7" rx="0.5" />
      <rect x="-2.5" y="8" width="5" height="7" rx="0.5" />
      <rect x="-15" y="-2.5" width="7" height="5" rx="0.5" />
      <rect x="8" y="-2.5" width="7" height="5" rx="0.5" />
      <!-- Diagonal teeth -->
      <rect x="-11" y="-12" width="6" height="5" rx="0.5" transform="rotate(45 -8 -9.5)"/>
      <rect x="5" y="-12" width="6" height="5" rx="0.5" transform="rotate(-45 8 -9.5)"/>
      <rect x="-11" y="7" width="6" height="5" rx="0.5" transform="rotate(-45 -8 9.5)"/>
      <rect x="5" y="7" width="6" height="5" rx="0.5" transform="rotate(45 8 9.5)"/>
    </g>

    <!-- Inner circle -->
    <circle cx="0" cy="0" r="8" fill="url(#logoCollapsedGradient)" opacity="0.9"/>

    <!-- Center dot -->
    <circle cx="0" cy="0" r="3.5" fill="white" />
  </g>
</svg>
