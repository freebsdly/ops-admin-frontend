<svg width="256" height="56" viewBox="0 0 256 56" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1890ff" />
      <stop offset="100%" stop-color="#52c41a" />
    </linearGradient>
  </defs>
  
  <!-- Background rectangle fills entire area -->
  <rect width="256" height="56" fill="url(#logoGradient)" rx="0"/>
  
  <!-- Logo icon and text -->
  <g transform="translate(16, 14)">
    <!-- Gear icon -->
    <circle cx="20" cy="14" r="10" fill="white" />
    <circle cx="20" cy="14" r="8" fill="url(#logoGradient)" />
    <circle cx="20" cy="14" r="3" fill="white" />
    
    <!-- Gear teeth -->
    <rect x="28" y="12" width="4" height="4" fill="white" transform="rotate(45 20 14)" />
    <rect x="8" y="12" width="4" height="4" fill="white" transform="rotate(-45 20 14)" />
    <rect x="18" y="22" width="4" height="4" fill="white" transform="rotate(0 20 14)" />
    <rect x="18" y="4" width="4" height="4" fill="white" transform="rotate(0 20 14)" />
    
    <!-- Text -->
    <text x="50" y="20" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="18" font-weight="600" fill="white" text-anchor="start">
      Ops Admin
    </text>
    
    <!-- Tagline -->
    <text x="50" y="35" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="12" font-weight="400" fill="rgba(255, 255, 255, 0.85)" text-anchor="start">
      DevOps Platform
    </text>
  </g>
</svg>